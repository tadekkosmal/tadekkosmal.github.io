# Site identity
locale: "en-US"
title: "Tadek Kosmal"
name: "Tadek Kosmal"
description: "Robotics, additive manufacturing, in-situ sensing, and computational fabrication."
url: "https://tadekkosmal.github.io"
baseurl: ""
repository: "tadekkosmal/tadekkosmal.github.io"
timezone: "America/New_York"

# Contact and profile information
author:
  name: "Tadek Kosmal"
  title: "PhD Candidate in Mechanical Engineering at Virginia Tech"
  email: "tadekk@vt.edu"
  location: "Blacksburg, Virginia"
  github: "tadekkosmal"
  avatar: "/assets/images/tadekk_cropped.jpg"

# Update this path if your PDF uses a different filename.
resume_pdf: "/assets/documents/Tadek_Kosmal_Resume.pdf"

# Jekyll
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

collections:
  random:
    output: true
    permalink: /notes/:path/

# GitHub Pages-supported plugins only
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jemoji
  - jekyll-seo-tag

sass:
  sass_dir: assets/css
  style: compressed

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

# Local layouts override the former Minimal Mistakes presentation layer.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      read_time: true
  - scope:
      path: "_random"
      type: random
    values:
      layout: single
